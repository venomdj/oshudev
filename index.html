        function TimerRing({ progress, color, size=200, strokeW=6, children }) {

              <svg width={size} height={size} style={{ transform:"rotate(-90deg)" }}>
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke="rgba(255,255,255,0.04)" strokeWidth={strokeW}/>
                <circle cx={size/2} cy={size/2} r={r} fill="none" stroke={color} strokeWidth={strokeW}
                  strokeDasharray={circ} strokeDashoffset={circ * (1 - progress)} className="timer-ring"
                />
              </svg>
              <div style={{ position:"absolute", inset:0, display:"flex", alignItems:"center", justifyContent:"center", flexDirection:"column" }}>
                {children}
              </div>
            </div>
          );

        function TimerView({ user, running, setRunning, remaining, setRemaining, totalDuration, setTotalDuration, sessionType, setSessionType, ambientSound, setAmbientSound, onTimerStateChange }) {

          useEffect(() => {
            let interval = null;
            if (timerRunning && remaining > 0) {
              interval = setInterval(() => {
                setRemaining(r => {
                  if (r <= 1) {
                    setTimerRunning(false);
                    return 0;
                  }
                  return r - 1;
                });
              }, 1000);
            } else {
              clearInterval(interval);
            }
            return () => clearInterval(interval);
          }, [timerRunning, remaining]);

          // Real-time peer listeners for cross-syncing metrics
          useEffect(() => {
            if (!fbReady || !profileId || !db) return;

            const targetPartnerId = profileId === "DEV" ? "OSHU" : "DEV";
            
            // Listen to partner's state updates
            const partnerDocRef = doc(db, "profiles", targetPartnerId);
            const unsubPartner = onSnapshot(partnerDocRef, (snap) => {
              if (snap.exists()) {
                setPartnerTimer(snap.data().timer || null);
              }
            }, err => console.log("Partner listener error:", err));

            // Setup task subscriber loop
            const taskQuery = query(collection(db, "profiles", profileId, "tasks"));
            const unsubTasks = onSnapshot(taskQuery, (snap) => {
              const items = [];
              snap.forEach(d => items.push({ id: d.id, ...d.data() }));
              setTasks(items);
            });

            // Setup note subscriber loop
            const noteQuery = query(collection(db, "profiles", profileId, "notes"));
            const unsubNotes = onSnapshot(noteQuery, (snap) => {
              const items = [];
              snap.forEach(d => items.push({ id: d.id, ...d.data() }));
              setNotes(items);
            });

            return () => {
              unsubPartner();
              unsubTasks();
              unsubNotes();
            };
          }, [fbReady, profileId]);

          if (!profileId) {
            return <WelcomeScreen onSelect={setProfileId} />;
          }

          const user = INITIAL_PROFILES[profileId];
          const partner = profileId === "DEV" ? INITIAL_PROFILES.OSHU : INITIAL_PROFILES.DEV;

          // Dispatch transactional sync operations to Firestore base
          const handleTimerStateChange = (rem, type, run) => {
            if (!db) return;
            const myDocRef = doc(db, "profiles", profileId);
            setDoc(myDocRef, {
              timer: { remaining: rem, sessionType: type, running: run, updated: Date.now() }
            }, { merge: true }).catch(e => console.error(e));
          };

          const handleAddTask = (text) => {
            if (!db) {
              setTasks([...tasks, { id: String(Date.now()), text, done: false }]);
              return;
            }
            addDoc(collection(db, "profiles", profileId, "tasks"), {
              text, done: false, created: Date.now()
            });
          };

          const handleToggleTask = (id, currentDone) => {
            if (!db) {
              setTasks(tasks.map(t=>t.id===id?{...t, done:!currentDone}:t));
              return;
            }
            setDoc(doc(db, "profiles", profileId, "tasks", id), { done: !currentDone }, { merge: true });
          };

          const handleDeleteTask = (id) => {
            if (!db) {
              setTasks(tasks.filter(t=>t.id!==id));
              return;
            }
            deleteDoc(doc(db, "profiles", profileId, "tasks", id));
          };

          const handleAddNote = async () => {
            const tempTitle = "Raw Buffer Segment";
            if (!db) {
              const newId = String(Date.now());
              setNotes([{ id: newId, title: tempTitle, content: "" }, ...notes]);
              return newId;
            }
            const res = await addDoc(collection(db, "profiles", profileId, "notes"), {
              title: tempTitle, content: "", updated: Date.now()
            });
            return res.id;
          };

          const handleUpdateNote = (id, title, content) => {
            if (!db) {
              setNotes(notes.map(n=>n.id===id?{...n, title, content}:n));
              return;
            }
            setDoc(doc(db, "profiles", profileId, "notes", id), { title, content, updated: Date.now() }, { merge: true });
          };

          return (
            <div className="min-h-screen bg-[var(--bg-deep)] flex flex-row">
              <AmbientOrbs user={user} />
              <Sidebar user={user} activeView={activeView} onNav={setActiveView} onSwitchUser={() => setProfileId(null)} />
              <main className="flex-1 ml-[218px] p-8 z-10">
                {activeView === "dashboard" && <Dashboard user={user} partner={partner} onStartTimer={() => setActiveView("timer")} tasks={tasks} />}
                {activeView === "timer" && <TimerView user={user} running={timerRunning} setRunning={setTimerRunning} remaining={remaining} setRemaining={setRemaining} totalDuration={totalDuration} setTotalDuration={setTotalDuration} sessionType={sessionType} setSessionType={setSessionType} ambientSound={ambientSound} setAmbientSound={setAmbientSound} onTimerStateChange={handleTimerStateChange} />}
                {activeView === "tasks" && <TasksView user={user} tasks={tasks} onAddTask={handleAddTask} onDeleteTask={handleDeleteTask} onToggleTask={handleToggleTask} />}
                {activeView === "goals" && <GoalsView user={user} />}
                {activeView === "stats" && <AnalyticsView user={user} />}
                {activeView === "notes" && <NotesView user={user} notes={notes} onAddNote={handleAddNote} onUpdateNote={handleUpdateNote} />}
                {activeView === "coop" && <CoopView user={user} partner={partner} partnerTimer={partnerTimer} />}
              </main>
            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<MainApplicationBridge />);
    </script>
</body>
</html>
