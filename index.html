            "var(--bg-elevated)",
            `${color}2e`, `${color}55`, `${color}88`, color,
          ];
          return (
            <div style={{ display:"flex", gap:2.5, overflowX:"auto", paddingBottom:4 }}>
              {data.map((week,wi) => (
                <div key={wi} style={{ display:"flex", flexDirection:"column", gap:2.5 }}>
                  {week.map((val,di) => (
                    <div key={di} className="heatmap-cell"
                      data-tip={val===0 ? "No activity" : `~${val*45}min`}
                      style={{ background: colorMap[val] || colorMap[0] }}
                    />
                  ))}
                </div>
              ))}
            </div>
          );
        }

        function Sparkline({ data, color, height=36, width=90 }) {
          if (!data || data.length < 2) return null;
          const max = Math.max(...data, 0.01);
          const pts = data.map((v,i) => `${(i/(data.length-1))*width},${height-(v/max)*height}`).join(" ");
          return (
            <svg width={width} height={height} style={{ overflow:"visible" }}>
              <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5"
                strokeLinejoin="round" style={{ filter:`drop-shadow(0 0 4px ${color}88)` }}/>

        function TimerView({ user, running, setRunning, remaining, setRemaining, totalDuration, setTotalDuration, sessionType, setSessionType, ambientSound, setAmbientSound }) {

          const startTimer = (dur, label) => {
            setRemaining(dur); setTotalDuration(dur); setSessionType(label); setRunning(true); setCompleted(false);
          };

          useEffect(() => {
            if (running && remaining > 0) {
              intervalRef.current = setInterval(() => {
                setRemaining(r => {
                  if (r <= 1) {
                    setRunning(false);
                    setCompleted(true);
                    return 0;
                  }
                  return r - 1;
                });
              }, 1000);
            } else {
              clearInterval(intervalRef.current);
            }
            return () => clearInterval(intervalRef.current);
          }, [running, remaining]);

          const progress = totalDuration > 0 ? 1 - remaining / totalDuration : 0;

          return (
            <div className="grid grid-cols-1 lg:grid-cols-3 gap-5 fade-up">

          const [ambientSound, setAmbientSound] = useState("none");

          // Profile State Containers
          const [devTasks, setDevTasks] = useState(PROFILES.DEV.tasks);
          const [oshuTasks, setOshuTasks] = useState(PROFILES.OSHU.tasks);

          // Dynamic Keyboard Command Palette Core Listener Sequence
          useEffect(() => {
            const triggerPalette = (e) => {
              if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                e.preventDefault();
                setCommandPaletteOpen(o => !o);
              }
            };
            window.addEventListener('keydown', triggerPalette);
            return () => window.removeEventListener('keydown', triggerPalette);
          }, []);

          if (!currentProfile) {
            return <WelcomeScreen onSelect={(profileId) => setCurrentProfile(PROFILES[profileId])} />;
          }

          const partner = currentProfile.id === "DEV" ? PROFILES.OSHU : PROFILES.DEV;
          const tasks = currentProfile.id === "DEV" ? devTasks : oshuTasks;
          const setTasks = currentProfile.id === "DEV" ? setDevTasks : setOshuTasks;
          const goals = currentProfile.goals;

          const executeActionCommand = (actionId) => {
            if(actionId === "timer_start") { setActiveView("timer"); setTimerRunning(true); }
            else if(actionId === "timer_pomodo") { setActiveView("timer"); setRemaining(25*60); setTotalDuration(25*60); setSessionType("Pomodoro"); setTimerRunning(true); }
            else if(actionId === "new_task") setActiveView("tasks");
            else if(actionId === "new_note") setActiveView("notes");
            else if(actionId === "nav_dashboard") setActiveView("dashboard");
            else if(actionId === "nav_timer") setActiveView("timer");
            else if(actionId === "nav_tasks") setActiveView("tasks");
            else if(actionId === "nav_stats") setActiveView("stats");
            else if(actionId === "nav_coop") setActiveView("coop");
            else if(actionId === "switch_user") setCurrentProfile(null);
          };

          return (
            <div className="min-h-screen bg-[var(--bg-deep)] relative overflow-x-hidden flex flex-row">
              <AmbientOrbs user={currentProfile} />
              <Sidebar user={currentProfile} partner={partner} activeView={activeView} onNav={setActiveView} onSwitchUser={() => setCurrentProfile(null)} timerRunning={timerRunning} />
              
              <main className="main-content flex-1 ml-0 md:ml-[218px] p-4 md:p-8 z-10 transition-all duration-300">
                {activeView === "dashboard" && <Dashboard user={currentProfile} partner={partner} onStartTimer={() => setActiveView("timer")} tasks={tasks} goals={goals} />}
                {activeView === "timer" && <TimerView user={currentProfile} running={timerRunning} setRunning={setTimerRunning} remaining={remaining} setRemaining={setRemaining} totalDuration={totalDuration} setTotalDuration={setTotalDuration} sessionType={sessionType} setSessionType={setSessionType} ambientSound={ambientSound} setAmbientSound={setAmbientSound} />}
                {activeView === "tasks" && <TasksView user={currentProfile} tasks={tasks} setTasks={setTasks} />}
                {activeView === "goals" && <GoalsView user={currentProfile} />}
                {activeView === "stats" && <AnalyticsView user={currentProfile} />}
                {activeView === "notes" && <NotesView user={currentProfile} />}
                {activeView === "coop" && <CoopView user={currentProfile} partner={partner} />}
                {activeView === "calendar" && <CalendarView user={currentProfile} />}
              </main>

              {/* Command Palette System Modal Rendering */}
              {commandPaletteOpen && (
                <div className="cmd-overlay" onClick={() => setCommandPaletteOpen(false)}>
                  <div className="cmd-box" onClick={e => e.stopPropagation()}>
                    <div className="p-4 border-b border-[var(--border)] flex items-center gap-3">
                      <span className="text-[var(--text-muted)] text-lg">⌕</span>
                      <input className="bg-transparent border-none outline-none text-white text-sm flex-1 font-sans" autoFocus placeholder="Execute global pipeline protocol..." onKeyDown={e => {
                        if(e.key === 'Escape') setCommandPaletteOpen(false);
                      }} />
                    </div>
                    <div className="max-h-64 overflow-y-auto py-2">
                      {COMMANDS.map(c => (
                        <div key={c.id} className="flex items-center gap-3 px-4 py-2 hover:bg-[var(--bg-elevated)] cursor-pointer text-xs" onClick={() => { executeActionCommand(c.id); setCommandPaletteOpen(false); }}>
                          <span style={{color: currentProfile.color}}>{c.icon}</span>
                          <span className="text-white">{c.label}</span>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<MainApplicationBridge />);
    </script>
</body>
</html>
